<!doctype html><html><head><meta charset="utf-8"><title>SCREC</title><link rel="stylesheet" href="bar.css"></head>
<body><div id="app">
  <div id="bar">
    <div id="grip" title="Drag to move"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="7" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="7" cy="13" r="1.3"/></g></svg></div>
    <div id="idle" class="grp">
      <button id="btnVid" class="ib rec" title="Record video"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg></button>
      <button id="btnImg" class="ib" title="Screenshot"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button id="btnSet" class="ib" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <div id="recing" class="grp hidden">
      <span id="dot"></span><span id="timer">00:00</span><span id="spd" class="hidden"></span>
      <button id="btnPause" class="ib" title="Pause"><svg id="icPause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg><svg id="icPlay" class="hidden" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg></button>
      <button id="btnStop" class="ib stop" title="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div id="msg" class="hidden"></div>

  <div id="panel" class="hidden">
    <label>Resolution
      <select id="sRes"><option value="auto">Auto (match selection)</option><option value="720">720p</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">4K</option></select></label>
    <label>If selection ≠ resolution
      <select id="sFit"><option value="fit">Scale to fit (bars)</option><option value="stretch">Stretch to fit</option><option value="fill">Fill &amp; crop</option></select></label>
    <label>Frame rate
      <select id="sFps"><option value="24">24</option><option value="30">30</option><option value="60">60</option></select></label>
    <label class="chk"><input type="checkbox" id="cSys"> Device audio</label>
    <label class="chk"><input type="checkbox" id="cMic"> Microphone</label>
    <label>Mic device <select id="sMic"></select></label>
    <label class="chk"><input type="checkbox" id="cZoom"> Director hotkeys (hold Ctrl+Alt+Shift)</label>
    <div class="hint">Mouse = aim box · LMB = zoom to box · wheel = amount · arrows = nudge · RMB = draw / tap for beacon · 1-9 = speed (5 = normal)</div>
    <label>Zoom amount <span class="rng"><input type="range" id="rZoom" min="1.25" max="6" step="0.25"><b id="vZoom"></b></span></label>
    <label>Mark color <input type="color" id="iCol"></label>
    <label>Mark style <select id="sAnn"><option value="pen">Pen</option><option value="marker">Highlighter</option><option value="glow">Neon glow</option></select></label>
    <label>Mark size <span class="rng"><input type="range" id="rSize" min="2" max="16" step="1"><b id="vSize"></b></span></label>
    <label class="chk"><input type="checkbox" id="cStart"> Start with Windows</label>
    <div class="dirrow"><span id="dir"></span><button id="btnDir" class="small">Change</button></div>
    <div class="dirrow"><span id="ver"></span><button id="btnUpd" class="small">Updates</button><button id="btnHide" class="small">Hide</button><button id="btnQuit" class="small danger">Quit</button></div>
  </div>

  <div id="result" class="hidden">
    <div id="preview"></div>
    <div id="rname"></div>
    <div class="btns">
      <button id="rMove" class="small primary">Move to…</button>
      <button id="rOpen" class="small">Show</button>
      <button id="rCopy" class="small">Copy</button>
      <button id="rDel" class="small danger">Delete</button>
      <button id="rDone" class="small">Done</button>
    </div>
  </div>
</div>
<script src="bar.js"></script></body></html>
