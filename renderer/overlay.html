<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;font:600 13px system-ui,"Segoe UI",sans-serif}
/* Faint tint kept on purpose (verified setup: the window is WS_EX_TRANSPARENT, see markTransparent in main.js, and
   all mouse/keyboard input is swallowed by the input worker, so nothing here ever receives input). */
body{background:rgba(0,0,0,.012)}
canvas{position:fixed;inset:0}
#box{position:fixed;left:0;top:0;display:none;box-sizing:border-box;border:2px dashed rgba(255,255,255,.95);will-change:transform;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.35);background:rgba(255,255,255,.04)}
#box.active{border:3px solid #ef4444;background:rgba(239,68,68,.07)}
#lbl{position:absolute;left:0;top:-22px;background:rgba(17,17,17,.85);color:#fff;padding:2px 7px;border-radius:5px;font-size:12px;white-space:nowrap}
#hud{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(17,17,17,.88);color:#fff;
  padding:7px 16px;border-radius:9px;font-size:15px;visibility:hidden}
</style></head><body>
<!-- The single on-screen overlay for the hotkey mode: viewport box + HUD + live marks.
     Excluded from capture (the recorder paints marks into the video itself).
     Performance rules: everything is coalesced into ONE requestAnimationFrame; the box moves with a GPU transform
     (no layout); nothing animates by CSS transition; idle = no frames at all. -->
<canvas id="c"></canvas><div id="box"><div id="lbl"></div></div><div id="hud"></div>
<script src="marks.js"></script>
<script>
const box = document.getElementById('box'), lbl = document.getElementById('lbl'), hudEl = document.getElementById('hud');
const c = document.getElementById('c'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
const marks = new Marks();
let origin = { x: 0, y: 0 };
function size() { c.width = innerWidth * dpr; c.height = innerHeight * dpr; }
size(); addEventListener('resize', size);
api.onOverlayInit(o => { origin = o; });

const PERF = /perf=1/.test(location.search);
let pFrames = 0, pMax = 0, pLast = 0, pBox = 0;
if (PERF) setInterval(() => { api.perf('overlay', { fps: pFrames, maxFrameMs: Math.round(pMax), boxEv: pBox }); pFrames = 0; pMax = 0; pBox = 0; }, 1000);

let pending = null, raf = 0, hudUntil = 0, marksLive = false, lastDraw = 0, dirty = false;
let cur = { w: -1, h: -1, active: null, level: null };
const need = () => { if (!raf) raf = requestAnimationFrame(frame); };

api.onBox(b => { pBox++; pending = b; need(); });
api.onHud(text => { hudEl.textContent = text; hudEl.style.visibility = 'visible'; hudUntil = performance.now() + 1300; need(); });
api.onAnno(m => { marks.handle(m); marksLive = true; dirty = true; need(); });

function frame(t) {
  raf = 0;
  if (PERF) { if (pLast) pMax = Math.max(pMax, t - pLast); pLast = t; pFrames++; }
  if (pending) {
    const b = pending; pending = null;
    box.style.display = 'block';
    if (b.width !== cur.w || b.height !== cur.h) { box.style.width = b.width + 'px'; box.style.height = b.height + 'px'; cur.w = b.width; cur.h = b.height; }
    box.style.transform = 'translate3d(' + b.x + 'px,' + b.y + 'px,0)';
    if (b.active !== cur.active) { box.classList.toggle('active', b.active); cur.active = b.active; cur.level = null; }
    if (b.level !== cur.level) { cur.level = b.level; lbl.textContent = b.level + '×' + (b.active ? ' · zoomed in video' : ' · hold LMB to zoom'); }
    lbl.style.top = b.y < 26 ? '4px' : '-22px';
  }
  if (hudUntil && t > hudUntil) { hudUntil = 0; hudEl.style.visibility = 'hidden'; }
  if (marksLive && (dirty || t - lastDraw >= 15)) { // redraw marks at most ~60x/s, whatever the monitor refresh rate
    dirty = false; lastDraw = t;
    ctx.setTransform(dpr, 0, 0, dpr, -origin.x * dpr, -origin.y * dpr);
    ctx.clearRect(origin.x, origin.y, innerWidth, innerHeight);
    marks.draw(ctx);
    if (marks.empty) marksLive = false;
  }
  if (marksLive || hudUntil) need(); // keep ticking only while something is animating
}
</script></body></html>
