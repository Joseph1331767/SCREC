<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
canvas{position:fixed;inset:0}
</style></head><body><canvas id="c"></canvas>
<script>
// Freehand annotations (RMB drag) and attention beacons (RMB tap). Visible in recordings on purpose.
const c = document.getElementById('c'), ctx = c.getContext('2d');
let origin = { x: 0, y: 0 }, strokes = [], beacons = [], cur = null, raf = 0;
const HOLD = 1500, FADE = 700, BEACON = 1900;
const dpr = window.devicePixelRatio || 1;
function size() { c.width = innerWidth * dpr; c.height = innerHeight * dpr; }
size(); addEventListener('resize', size);
api.onOverlayInit(o => { origin = o; });

api.onAnno(m => {
  if (m.type === 'start') {
    cur = { pts: [{ x: m.x - origin.x, y: m.y - origin.y }], style: m.style, t0: performance.now(), end: 0, len: 0 };
    strokes.push(cur);
  } else if (m.type === 'pt' && cur) {
    const p = { x: m.x - origin.x, y: m.y - origin.y }, l = cur.pts[cur.pts.length - 1];
    cur.len += Math.hypot(p.x - l.x, p.y - l.y); cur.pts.push(p);
  } else if (m.type === 'end' && cur) {
    const now = performance.now();
    if (now - cur.t0 < 320 && cur.len < 10) { // a tap → beacon
      beacons.push({ x: cur.pts[0].x, y: cur.pts[0].y, t0: now, style: cur.style });
      strokes.splice(strokes.indexOf(cur), 1);
    } else cur.end = now;
    cur = null;
  } else if (m.type === 'probe') { if (!strokes.length && !beacons.length) api.annoEmpty(); }
  if (!raf) raf = requestAnimationFrame(frame);
});

function drawStroke(s, alpha) {
  const { color, style, size: w } = s.style;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = color; ctx.globalAlpha = alpha;
  if (style === 'marker') { ctx.lineWidth = w * 3.2; ctx.globalAlpha = alpha * 0.4; ctx.lineCap = 'butt'; }
  else if (style === 'glow') { ctx.lineWidth = w; ctx.shadowColor = color; ctx.shadowBlur = w * 3; }
  else ctx.lineWidth = w;
  ctx.beginPath();
  s.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  if (s.pts.length === 1) ctx.lineTo(s.pts[0].x + 0.1, s.pts[0].y);
  ctx.stroke();
  if (style === 'glow') { ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, w * 0.35); ctx.globalAlpha = alpha * 0.9; ctx.stroke(); }
  ctx.restore();
}
function drawBeacon(b, t) {
  const k = t / BEACON, color = b.style.color;
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  for (let i = 0; i < 3; i++) {
    const kk = (k * 2.2 - i * 0.28); if (kk < 0 || kk > 1) continue;
    ctx.globalAlpha = (1 - kk) * 0.9; ctx.lineWidth = 4 * (1 - kk) + 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, 10 + 80 * kk, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = Math.max(0, 1 - k) * (0.65 + 0.35 * Math.sin(t / 90));
  ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function frame() {
  const now = performance.now();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  strokes = strokes.filter(s => s === cur || now - s.end < HOLD + FADE);
  beacons = beacons.filter(b => now - b.t0 < BEACON);
  for (const s of strokes) drawStroke(s, s === cur ? 1 : Math.min(1, 1 - (now - s.end - HOLD) / FADE));
  for (const b of beacons) drawBeacon(b, now - b.t0);
  raf = 0;
  if (strokes.length || beacons.length) raf = requestAnimationFrame(frame); else api.annoEmpty();
}
</script></body></html>
