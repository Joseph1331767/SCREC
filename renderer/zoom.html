<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
img{position:fixed;inset:0;width:100vw;height:100vh;object-fit:fill;will-change:transform}
</style></head><body><img id="v" alt="">
<script>
// Shows a snapshot of the screen and scales it about the cursor, so the point under the cursor stays put
// and the view can never go past the screen edges.
const v = document.getElementById('v');
let origin = { x: 0, y: 0 }, z = 1, target = 1, mx = 0, my = 0, raf = 0, url = null;
const Z = 2;
api.onZoomImage((buf, o) => {
  origin = o; z = 1; target = 1;
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
  v.onload = () => { v.style.transform = 'none'; api.zoomReady(); };
  v.src = url;
});
api.onZoom(s => {
  mx = s.x - origin.x; my = s.y - origin.y;
  target = s.active ? Z : 1;
  if (!raf) raf = requestAnimationFrame(step);
});
function step() {
  z += (target - z) * 0.35;
  if (Math.abs(target - z) < 0.005) z = target;
  v.style.transformOrigin = mx + 'px ' + my + 'px';
  v.style.transform = 'scale(' + z + ')';
  raf = 0;
  if (z !== target || target !== 1) raf = requestAnimationFrame(step);
  else api.zoomHide();
}
</script></body></html>
