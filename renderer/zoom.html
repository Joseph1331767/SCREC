<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:fill;will-change:transform}
</style></head><body><video id="v" muted autoplay></video>
<script>
const v = document.getElementById('v');
let stream = null, origin = { x: 0, y: 0 }, z = 1, target = 1, mx = 0, my = 0, raf = 0;
const Z = 2;
api.onZoomPrepare(async ({ sourceId, x, y }) => {
  origin = { x, y };
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: sourceId, maxFrameRate: 60 } } });
    v.srcObject = stream; v.play();
  } catch (e) { console.error(e); }
});
api.onZoomRelease(() => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; v.srcObject = null; } });
api.onZoom(s => {
  mx = s.x - origin.x; my = s.y - origin.y;
  target = s.active ? Z : 1;
  if (!raf) raf = requestAnimationFrame(step);
});
function step() {
  z += (target - z) * 0.35;
  if (Math.abs(target - z) < 0.005) z = target;
  v.style.transformOrigin = mx + 'px ' + my + 'px';
  v.style.transform = 'scale(' + z + ')';
  raf = 0;
  if (z !== target || target !== 1) raf = requestAnimationFrame(step);
  else api.zoomHide();
}
</script></body></html>
